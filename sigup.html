<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseNet – Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 380px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 95%;
            padding: 12px;
            background: #4b7bec;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #3867d6;
        }

        .or {
            margin: 15px 0;
            font-weight: bold;
            color: #aaa;
        }

        .social-btn {
            width: 95%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .google {
            background: #fff;
            border: 1px solid #ddd;
        }

        .facebook {
            background: #1877f2;
            color: white;
        }

        .mobile {
            background: #2ecc71;
            color: white;
        }

        a {
            text-decoration: none;
            color: #4b7bec;
            font-weight: bold;
        }

        .login-link {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create Account</h2>
        <p>Join PulseNet and start your mental wellness journey.</p>

        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>
        <input type="password" placeholder="Password" required>
        <input type="password" placeholder="Confirm Password" required>

        <button>Create Account</button>

        <div class="or">──────── OR ────────</div>

        <button class="social-btn google">Signup with Google</button>
        <button class="social-btn facebook">Signup with Facebook</button>
        <button class="social-btn mobile">Signup with Mobile Number</button>

        <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
    </div>

</body>
</html>
